name: Feedback source fixture
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/feedback-source-fixture.yml']
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive repository source and dependencies only
        run: tar --exclude=.git --exclude='*.tar.gz' --exclude='.env*' -czf /tmp/feedback-source.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feedback-source-fixture
          path: /tmp/feedback-source.tar.gz
          retention-days: 1
