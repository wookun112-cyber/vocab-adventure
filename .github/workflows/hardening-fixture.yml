name: Hardening source fixture
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/hardening-fixture.yml']
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: tar --exclude=.git --exclude=.env --exclude=.env.* --exclude=test-results --exclude=.vercel -czf /tmp/hardening-source.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardening-source-fixture
          path: /tmp/hardening-source.tar.gz
          retention-days: 1
