name: Seed 6000 fixed curriculum

on:
  push:
    paths:
      - ".seed-curriculum-trigger"

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Build fixed vocabulary database
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vocab-adventure-neon.vercel.app/api/vocab?build=curriculum6000"

          seed_band () {
            local band="$1"
            local target="$2"
            local added=0
            local failures=0

            echo "=== band $band target $target ==="
            while [ "$added" -lt "$target" ]; do
              local remain=$((target-added))
              local batch=100
              if [ "$remain" -lt "$batch" ]; then batch="$remain"; fi

              echo "band=$band added=$added requesting=$batch"
              set +e
              response=$(curl -fsS --max-time 55 --retry 5 --retry-all-errors --retry-delay 4                 "$BASE&band=$band&count=$batch")
              rc=$?
              set -e

              if [ "$rc" -ne 0 ]; then
                failures=$((failures+1))
                echo "request failed rc=$rc failures=$failures"
                if [ "$failures" -ge 6 ]; then exit 1; fi
                sleep 8
                continue
              fi

              echo "$response"
              inserted=$(printf '%s' "$response" | jq -r '.inserted // 0')
              if ! [[ "$inserted" =~ ^[0-9]+$ ]]; then inserted=0; fi

              if [ "$inserted" -le 0 ]; then
                failures=$((failures+1))
                echo "no rows inserted failures=$failures"
                if [ "$failures" -ge 6 ]; then exit 1; fi
                sleep 8
                continue
              fi

              failures=0
              added=$((added+inserted))
              sleep 3
            done

            echo "=== band $band complete: $added ==="
          }

          seed_band 1 600
          seed_band 2 600
          seed_band 3 700
          seed_band 4 700
          seed_band 5 700
          seed_band 6 700
          seed_band 7 700
          seed_band 8 650
          seed_band 9 650

          echo "CURRICULUM_SEED_COMPLETE"
